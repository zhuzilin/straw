name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust tests and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatters
        run: python -m pip install 'black>=24.8' 'isort>=5.13'
      - name: Check formatting
        run: |
          cargo fmt --check
          python -m black --check src tests examples tools verification
          python -m isort --check-only src tests examples tools verification
      - name: Lint native core and Python bindings
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features python -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked

  python:
    name: Full suite / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test dependencies
        run: |
          python -m pip install 'build>=1.2' 'twine>=5' 'numpy>=1.24' 'pytest>=8'
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
      - name: Build the wheel
        run: python -m build --wheel
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Run all Python and protocol tests against the installed wheel
        # Includes examples, multiprocess recovery, the ownership model, crash
        # injection, a bounded I/O/GC benchmark and trace verification.
        run: python tools/check_wheel.py dist/*.whl --tests --report wheel-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-py${{ matrix.python }}
          path: wheel-check.json
          if-no-files-found: warn
